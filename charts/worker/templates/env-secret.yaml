{{- if not .Values.envSecretName }}
{{- $hasSecretData := or .Values.redis.username .Values.redis.password .Values.redis.sentinel.username .Values.redis.sentinel.password .Values.redis.tlsConfig.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "worker.envSecretName" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
type: Opaque
{{- if $hasSecretData }}
data:
  {{- include "worker.secret.optionalKey" (dict "key" "UNIVER_EXCHANGE_REDIS_USERNAME" "value" .Values.redis.username) | nindent 2 }}
  {{- include "worker.secret.optionalKey" (dict "key" "UNIVER_EXCHANGE_REDIS_PASSWORD" "value" .Values.redis.password) | nindent 2 }}
  {{- include "worker.secret.optionalKey" (dict "key" "UNIVER_EXCHANGE_REDIS_SENTINEL_USERNAME" "value" .Values.redis.sentinel.username) | nindent 2 }}
  {{- include "worker.secret.optionalKey" (dict "key" "UNIVER_EXCHANGE_REDIS_SENTINEL_PASSWORD" "value" .Values.redis.sentinel.password) | nindent 2 }}
  {{- include "worker.secret.optionalKey" (dict "key" "UNIVER_EXCHANGE_REDIS_TLS_KEY" "value" .Values.redis.tlsConfig.key) | nindent 2 }}
{{- else }}
data: {}
{{- end }}
{{- end }}

{{- if not .Values.envSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "universer.envSecretName" . }}
  labels:
    {{- include "universer.labels" . | nindent 4 }}
type: Opaque
data:
  UNIVERSER_DATABASE_USERNAME: {{ .Values.config.database.username | toString | b64enc | quote }}
  UNIVERSER_DATABASE_PASSWORD: {{ .Values.config.database.password | toString | b64enc | quote }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_DATABASE_DSN" "value" (include "universer.database.dsn" .Values.config.database)) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_DATABASE_REPLICA_DSN" "value" (include "universer.database.replicaDSN" .Values.config.database)) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_RABBITMQ_USERNAME" "value" .Values.config.rabbitmq.username) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_RABBITMQ_PASSWORD" "value" .Values.config.rabbitmq.password) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_RABBITMQ_ADDRESS" "value" (printf "amqp://%v:%v@%s:%v/" .Values.config.rabbitmq.username .Values.config.rabbitmq.password (tpl .Values.config.rabbitmq.host .) .Values.config.rabbitmq.port)) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_RABBITMQ_CLUSTER_USERNAME" "value" .Values.config.rabbitmq.cluster.username) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_RABBITMQ_CLUSTER_PASSWORD" "value" .Values.config.rabbitmq.cluster.password) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_REDIS_USERNAME" "value" .Values.config.redis.username) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_REDIS_PASSWORD" "value" .Values.config.redis.password) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_REDIS_SENTINEL_USERNAME" "value" .Values.config.redis.sentinel.username) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_REDIS_SENTINEL_PASSWORD" "value" .Values.config.redis.sentinel.password) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_REDIS_TLS_KEY" "value" .Values.config.redis.tlsConfig.key) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_S3_ACCESS_KEY_ID" "value" .Values.config.s3.accessKeyID) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_S3_ACCESS_KEY_SECRET" "value" .Values.config.s3.accessKeySecret) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_USIP_API_KEY" "value" .Values.config.usip.apikey) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_SENTRY_DSN" "value" .Values.config.sentryConfig.dsn) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_LOCAL_KMS_CMK_BASE64" "value" .Values.config.dataProtectionConf.localKMS.cmkBase64) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_AWS_KMS_ACCESS_KEY_ID" "value" .Values.config.dataProtectionConf.awskms.accessKeyID) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_AWS_KMS_ACCESS_KEY_SECRET" "value" .Values.config.dataProtectionConf.awskms.accessKeySecret) | nindent 2 }}
  {{- include "universer.secret.optionalKey" (dict "key" "UNIVERSER_AWS_KMS_KEY_ID" "value" .Values.config.dataProtectionConf.awskms.kmsKeyID) | nindent 2 }}
{{- end }}

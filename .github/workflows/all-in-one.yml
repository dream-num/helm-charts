name: ☀️ AllInOne

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  OSSUTIL_VERSION: 2.3.0

jobs:
  build-amd64:
    name: build-amd64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up ossutil
      run: |
        case "${{ runner.arch }}" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "Unsupported runner architecture: ${{ runner.arch }}"; exit 1 ;;
        esac
        archive="ossutil-${OSSUTIL_VERSION}-linux-${arch}"
        curl --fail --show-error --location \
          --retry 3 --connect-timeout 10 --max-time 300 \
          --output "${archive}.zip" \
          "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/${archive}.zip"
        unzip -q "${archive}.zip"
        sudo install -m 0755 "${archive}/ossutil" /usr/local/bin/ossutil
        ossutil version

    - run: |
        cp -r .github/all-in-one/docker-compose/ all-in-one && cd all-in-one

        bash build.sh amd64

        ls -l

    - name: Sync all-in-one.tar to OSS
      timeout-minutes: 120
      env:
        OSS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
        OSS_ACCESS_KEY_SECRET: ${{ secrets.S3_ACCESS_KEY_SECRET }}
        OSS_REGION: cn-shenzhen
        OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      run: |
        ossutil cp "${ALLINONE_PATH}" "oss://${OSS_BUCKET}/release/${ALLINONE_TAR}" \
          --force --connect-timeout 30 --read-timeout 120 --retry-times 10

  build-arm64:
    name: build-arm64
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4

    - name: Set up ossutil
      run: |
        case "${{ runner.arch }}" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "Unsupported runner architecture: ${{ runner.arch }}"; exit 1 ;;
        esac
        archive="ossutil-${OSSUTIL_VERSION}-linux-${arch}"
        curl --fail --show-error --location \
          --retry 3 --connect-timeout 10 --max-time 300 \
          --output "${archive}.zip" \
          "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/${archive}.zip"
        unzip -q "${archive}.zip"
        sudo install -m 0755 "${archive}/ossutil" /usr/local/bin/ossutil
        ossutil version

    - run: |
        cp -r .github/all-in-one/docker-compose/ all-in-one && cd all-in-one

        bash build.sh arm64

        ls -l

    - name: Sync all-in-one.tar to OSS
      timeout-minutes: 120
      env:
        OSS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
        OSS_ACCESS_KEY_SECRET: ${{ secrets.S3_ACCESS_KEY_SECRET }}
        OSS_REGION: cn-shenzhen
        OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      run: |
        ossutil cp "${ALLINONE_PATH}" "oss://${OSS_BUCKET}/release/${ALLINONE_TAR}" \
          --force --connect-timeout 30 --read-timeout 120 --retry-times 10

  build-k8s:
    name: build-k8s
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up ossutil
      run: |
        case "${{ runner.arch }}" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "Unsupported runner architecture: ${{ runner.arch }}"; exit 1 ;;
        esac
        archive="ossutil-${OSSUTIL_VERSION}-linux-${arch}"
        curl --fail --show-error --location \
          --retry 3 --connect-timeout 10 --max-time 300 \
          --output "${archive}.zip" \
          "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/${archive}.zip"
        unzip -q "${archive}.zip"
        sudo install -m 0755 "${archive}/ossutil" /usr/local/bin/ossutil
        ossutil version

    - run: |
        chartsFolder=$(pwd)/charts

        cp -r .github/all-in-one/k8s/ all-in-one && cd all-in-one

        bash build.sh $chartsFolder

        ls -l

    - name: Sync k8s-all-in-one.tar to OSS
      timeout-minutes: 120
      env:
        OSS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
        OSS_ACCESS_KEY_SECRET: ${{ secrets.S3_ACCESS_KEY_SECRET }}
        OSS_REGION: cn-shenzhen
        OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      run: |
        ossutil cp "${ALLINONE_PATH}" "oss://${OSS_BUCKET}/release/${ALLINONE_TAR}" \
          --force --connect-timeout 30 --read-timeout 120 --retry-times 10
